name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  openspec:
    name: openspec validate --all --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OpenSpec
        # 1.14.x перевёл «требование длиннее 500 символов» из INFO в WARNING,
        # а --strict считает warning ошибкой — гейт стал невоспроизводимым.
        # Пинуем версию, на которой репозиторий зелёный.
        run: npm install -g @fission-ai/openspec@1.13.1
      - name: Validate specs and changes
        run: openspec validate --all --strict
